name: Deploy Sprout Tycoon to GitHub Pages

# Publishes the game to a free public HTTPS URL on every push to the default
# branch. One-time setup: repo Settings → Pages → Build and deployment →
# Source: "GitHub Actions". After that this runs automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Turn on GitHub Pages automatically the first time this runs,
          # so no one has to flip the Settings switch by hand.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
